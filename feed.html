<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Bonfire • Realm Feed</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050308 url('https://images.unsplash.com/photo-1519681393784-d120267933ba?ixlib=rb-4.0.3&auto=format&fit=crop&w=2200&q=90') center/cover fixed no-repeat;
      --card: rgba(20, 12, 28, 0.86);
      --accent: #c53030;
      --accent-dark: #9b2c2c;
      --text: #e8d5b7;
      --text-dim: #a38c6f;
      --border: #4a2c2c;
      --glow: rgba(197, 48, 48, 0.35);
      --success: #6b9e62;
      --danger: #d32f2f;
      --admin: #ff9800;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Cinzel', serif;
      background: var(--bg);
      color: var(--text);
      background-attachment: fixed;
      min-height: 100vh;
      padding: 1.5rem 1rem;
    }

    header {
      text-align: center;
      padding: 2rem 0 2.5rem;
      margin-bottom: 2.5rem;
      border-bottom: 2px solid rgba(58,31,42,0.6);
      position: relative;
    }

    h1 {
      font-family: 'Cinzel Decorative', cursive;
      color: var(--accent);
      font-size: 3.6rem;
      text-shadow: 0 0 30px var(--accent), 4px 4px 0 #000;
      letter-spacing: 4px;
      margin-bottom: 0.6rem;
    }

    .username {
      color: var(--text-dim);
      font-size: 1.5rem;
      font-weight: 500;
    }

    .logout {
      position: absolute;
      top: 1.8rem;
      right: 1.5rem;
      padding: 0.8rem 1.6rem;
      background: rgba(58,31,42,0.7);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.05rem;
      transition: all 0.3s;
    }

    .logout:hover {
      background: var(--danger);
      color: white;
      transform: translateY(-2px);
    }

    .section {
      max-width: 700px;
      margin: 0 auto 3.5rem;
      background: var(--card);
      backdrop-filter: blur(16px);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 2.2rem;
      box-shadow: 0 25px 80px rgba(0,0,0,0.85), inset 0 0 60px rgba(0,0,0,0.7);
    }

    .video-section h2 {
      color: var(--accent);
      font-size: 2.2rem;
      margin-bottom: 1.4rem;
      text-shadow: 0 0 18px var(--accent);
    }

    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      margin-bottom: 1.6rem;
      box-shadow: 0 12px 45px rgba(0,0,0,0.7);
    }

    .video-container iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

    .reactions {
      display: flex;
      gap: 2rem;
      margin: 1.5rem 0 2rem;
      font-size: 1.7rem;
    }

    .btn-react {
      background: none;
      border: none;
      font-size: 2.4rem;
      cursor: pointer;
      transition: transform 0.3s, text-shadow 0.3s;
    }

    .btn-react:hover {
      transform: scale(1.4);
      text-shadow: 0 0 25px var(--accent);
    }

    .count {
      font-size: 1.2rem;
      color: var(--text-dim);
      min-width: 2.8rem;
    }

    .post-form {
      margin: 2rem 0 3.5rem;
    }

    .post-input-area {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      padding: 1.3rem;
      background: rgba(10,6,18,0.75);
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 1.1rem;
      resize: vertical;
      transition: all 0.3s;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 25px var(--glow);
    }

    .image-preview-container {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 0.6rem;
    }

    .image-preview {
      position: relative;
      width: 140px;
      height: 140px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid var(--border);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .image-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .remove-preview {
      position: absolute;
      top: -10px;
      right: -10px;
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      font-size: 1.1rem;
      line-height: 28px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    .file-label {
      display: inline-block;
      padding: 0.9rem 1.8rem;
      background: rgba(58,31,42,0.7);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .file-label:hover {
      background: rgba(197,48,48,0.25);
      color: var(--accent);
      transform: translateY(-2px);
    }

    .hidden-file-input {
      display: none;
    }

    .btn-post {
      margin-top: 1.2rem;
      padding: 1.1rem 2.4rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-post:hover {
      background: var(--accent-dark);
      transform: translateY(-3px);
    }

    .btn-post:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .feed {
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }

    .post {
      background: rgba(30,20,40,0.65);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 12px 45px rgba(0,0,0,0.65);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .post:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.9);
    }

    .post-header {
      display: flex;
      align-items: center;
      margin-bottom: 1.2rem;
    }

    .post-user {
      color: var(--accent);
      font-weight: 700;
      font-size: 1.4rem;
    }

    .post-date {
      margin-left: auto;
      font-size: 0.95rem;
      color: var(--text-dim);
    }

    .post-content {
      margin-bottom: 1.4rem;
      white-space: pre-wrap;
    }

    .post-image {
      max-width: 100%;
      border-radius: 12px;
      margin: 1.2rem 0;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      display: block;
    }

    .post-actions {
      display: flex;
      gap: 1.3rem;
      margin-top: 1rem;
      font-size: 1rem;
    }

    .btn-edit, .btn-delete {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      transition: color 0.25s;
    }

    .btn-edit:hover { color: #ff9800; }
    .btn-delete:hover { color: var(--danger); }

    .edit-controls {
      display: flex;
      gap: 1.2rem;
      margin-top: 1.2rem;
    }

    .edit-textarea {
      width: 100%;
      min-height: 140px;
      padding: 1.2rem;
      background: rgba(10,6,18,0.85);
      border: 2px solid var(--accent);
      border-radius: 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 1.08rem;
      resize: vertical;
    }

    .btn-save-edit, .btn-cancel-edit {
      padding: 0.7rem 1.5rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-save-edit { background: var(--success); color: white; }
    .btn-cancel-edit { background: #4a2a2a; color: var(--text); }

    .post-reactions {
      display: flex;
      gap: 1.6rem;
      margin: 1.4rem 0;
      font-size: 1.6rem;
    }

    .post-btn-react {
      background: none;
      border: none;
      font-size: 2rem;
      cursor: pointer;
      transition: transform 0.25s, opacity 0.25s;
    }

    .post-btn-react.active {
      transform: scale(1.35);
      text-shadow: 0 0 20px var(--accent);
    }

    .post-btn-react.inactive {
      opacity: 0.4;
    }

    .post-count {
      font-size: 1.15rem;
      color: var(--text-dim);
      min-width: 2.4rem;
    }

    .comment-form {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .comment-input {
      flex: 1;
      padding: 1rem 1.4rem;
      background: rgba(10,6,18,0.75);
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 1.05rem;
    }

    .btn-comment {
      padding: 1rem 1.8rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }

    .btn-comment:hover {
      background: var(--accent-dark);
    }

    .comments {
      margin-top: 1.5rem;
      padding-left: 1.4rem;
      border-left: 4px solid var(--border);
    }

    .comment {
      margin: 1.2rem 0;
      font-size: 1.05rem;
      position: relative;
    }

    .comment-user {
      color: var(--accent);
      font-weight: 600;
      margin-right: 0.7rem;
    }

    .comment-actions {
      position: absolute;
      right: 0;
      top: 0;
      display: flex;
      gap: 0.8rem;
    }

    .btn-delete-comment {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 0.9rem;
      cursor: pointer;
    }

    .btn-delete-comment:hover {
      color: #f44336;
    }

    @media (max-width: 640px) {
      h1 { font-size: 2.8rem; }
      .section { padding: 1.8rem; }
      header { padding: 1.5rem 0; }
      .logout { position: static; margin: 1.2rem auto 0; display: block; }
    }
  </style>
</head>
<body>

<header>
  <h1>The Bonfire</h1>
  <div class="username" id="usernameDisplay">Unkindled Soul</div>
  <button class="logout" id="logoutBtn">Fade to Ash</button>
</header>

<div class="section video-section" id="videoSection">
  <h2>The Herald's Message</h2>
  <div class="video-container">
    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Medieval realm ambiance" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
  </div>

  <div class="reactions">
    <button class="btn-react" id="likeBtn">❤️</button>
    <span class="count" id="likeCount">0</span>

    <button class="btn-react" id="dislikeBtn">👎</button>
    <span class="count" id="dislikeCount">0</span>
  </div>
</div>

<div class="section post-section">
  <h2>Speak into the Flame</h2>

  <div class="post-form">
    <div class="post-input-area">
      <textarea id="postContent" placeholder="What visions dost thou share by the fire...?"></textarea>

      <label class="file-label" for="imageUpload">+ Add Image (max 3)</label>
      <input type="file" id="imageUpload" class="hidden-file-input" accept="image/*" multiple>

      <div class="image-preview-container" id="previewContainer"></div>
    </div>

    <button class="btn-post" id="postBtn">Post</button>
  </div>

  <div class="feed" id="feed"></div>
</div>

<script>
// Wait until DOM is fully loaded before attaching anything
document.addEventListener("DOMContentLoaded", () => {
  // ────────────────────────────────────────────────
  // Auth & Admin check
  // ────────────────────────────────────────────────
  const currentUserRaw = localStorage.getItem("currentUser");

  if (!currentUserRaw) {
    console.warn("No currentUser → redirecting to signin");
    window.location.href = "signin.html";
    return;
  }

  let currentUser;
  try {
    currentUser = JSON.parse(currentUserRaw);
  } catch (e) {
    console.error("currentUser corrupted → clearing", e);
    localStorage.removeItem("currentUser");
    window.location.href = "signin.html";
    return;
  }

  if (!currentUser || !currentUser.email) {
    console.warn("currentUser missing email → clearing");
    localStorage.removeItem("currentUser");
    window.location.href = "signin.html";
    return;
  }

  const isAdmin = currentUser.email.toLowerCase() === "jaimericardos24@gmail.com";

  document.getElementById("usernameDisplay").textContent = 
    currentUser.username || currentUser.email.split('@')[0] || "Unkindled Soul";

  console.log("Logged in as:", currentUser.username || currentUser.email, { isAdmin });

  // ────────────────────────────────────────────────
  // Logout – with confirmation + debug
  // ────────────────────────────────────────────────
  const logoutBtn = document.getElementById("logoutBtn");

  if (logoutBtn) {
    console.log("Logout button found – handler attached");

    logoutBtn.onclick = () => {
      console.log("Fade to Ash clicked");

      if (!confirm("Really fade to ash and leave the bonfire?")) {
        console.log("Logout cancelled by user");
        return;
      }

      console.log("Logging out...");

      // Visual feedback
      logoutBtn.textContent = "Fading...";
      logoutBtn.disabled = true;

      localStorage.removeItem("currentUser");

      setTimeout(() => {
        window.location.href = "signin.html";
      }, 600); // short delay so user sees the change
    };
  } else {
    console.error("Logout button NOT found! Check ID='logoutBtn' in HTML");
  }

  // Rest of your code (reactions, posts, etc.) goes here...
  // ────────────────────────────────────────────────
  // Global Reactions (video post)
  // ────────────────────────────────────────────────
  let videoReactions = JSON.parse(localStorage.getItem("videoReactions")) || {};

  function updateVideoReactionUI() {
    const userId = currentUser.email || currentUser.username;
    const userReaction = videoReactions[userId];

    const likeBtn = document.getElementById("likeBtn");
    const dislikeBtn = document.getElementById("dislikeBtn");
    const likeCount = document.getElementById("likeCount");
    const dislikeCount = document.getElementById("dislikeCount");

    let likes = 0;
    let dislikes = 0;

    Object.values(videoReactions).forEach(r => {
      if (r === "like") likes++;
      if (r === "dislike") dislikes++;
    });

    likeCount.textContent = likes;
    dislikeCount.textContent = dislikes;

    likeBtn.classList.toggle("active", userReaction === "like");
    likeBtn.classList.toggle("inactive", userReaction && userReaction !== "like");

    dislikeBtn.classList.toggle("active", userReaction === "dislike");
    dislikeBtn.classList.toggle("inactive", userReaction && userReaction !== "dislike");
  }

  document.getElementById("likeBtn").onclick = () => {
    const userId = currentUser.email || currentUser.username;
    if (videoReactions[userId] === "like") {
      delete videoReactions[userId];
    } else {
      videoReactions[userId] = "like";
    }
    localStorage.setItem("videoReactions", JSON.stringify(videoReactions));
    updateVideoReactionUI();
  };

  document.getElementById("dislikeBtn").onclick = () => {
    const userId = currentUser.email || currentUser.username;
    if (videoReactions[userId] === "dislike") {
      delete videoReactions[userId];
    } else {
      videoReactions[userId] = "dislike";
    }
    localStorage.setItem("videoReactions", JSON.stringify(videoReactions));
    updateVideoReactionUI();
  };

  updateVideoReactionUI();

  // ────────────────────────────────────────────────
  // Image Upload + Preview
  // ────────────────────────────────────────────────
  const MAX_IMAGES = 3;
  let selectedFiles = [];

  const fileInput = document.getElementById("imageUpload");
  const previewContainer = document.getElementById("previewContainer");

  fileInput.addEventListener("change", (e) => {
    const files = Array.from(e.target.files);

    if (selectedFiles.length + files.length > MAX_IMAGES) {
      alert(`Maximum ${MAX_IMAGES} images allowed.`);
      return;
    }

    files.forEach(file => {
      if (!file.type.startsWith("image/")) return;

      selectedFiles.push(file);

      const reader = new FileReader();
      reader.onload = (ev) => {
        const wrapper = document.createElement("div");
        wrapper.className = "image-preview";

        const img = document.createElement("img");
        img.src = ev.target.result;

        const removeBtn = document.createElement("button");
        removeBtn.className = "remove-preview";
        removeBtn.textContent = "×";
        removeBtn.onclick = () => {
          const idx = selectedFiles.indexOf(file);
          if (idx > -1) selectedFiles.splice(idx, 1);
          wrapper.remove();
        };

        wrapper.appendChild(img);
        wrapper.appendChild(removeBtn);
        previewContainer.appendChild(wrapper);
      };
      reader.readAsDataURL(file);
    });
  });

  // ────────────────────────────────────────────────
  // Posts + Images + Comments + Admin Delete
  // ────────────────────────────────────────────────
  let posts = JSON.parse(localStorage.getItem("posts")) || [];

  function renderFeed() {
    const feed = document.getElementById("feed");
    feed.innerHTML = "";

    posts.forEach(post => {
      const isOwner = post.user === currentUser.username || post.user === currentUser.email.split('@')[0];

      const postEl = document.createElement("div");
      postEl.className = "post";
      postEl.dataset.id = post.id;

      let imagesHtml = "";
      if (post.images && post.images.length > 0) {
        imagesHtml = post.images.map(src => `
          <img src="${src}" class="post-image" alt="Uploaded image">
        `).join("");
      }

      postEl.innerHTML = `
        <div class="post-header">
          <div class="post-user">${post.user}${isAdmin ? ' <span style="color:var(--admin);font-size:0.9rem;">[ADMIN]</span>' : ''}</div>
          <div class="post-date">${new Date(post.date).toLocaleString()}</div>
        </div>

        <div class="post-content">${post.text.replace(/\n/g, "<br>")}</div>

        ${imagesHtml ? `<div class="post-images">${imagesHtml}</div>` : ""}

        <div class="post-reactions">
          <button class="post-btn-react like ${post.userReactions?.[currentUser.email] === 'like' ? 'active' : ''}">❤️</button>
          <span class="post-count like-count">${Object.values(post.userReactions || {}).filter(r => r === 'like').length}</span>

          <button class="post-btn-react dislike ${post.userReactions?.[currentUser.email] === 'dislike' ? 'active' : ''}">👎</button>
          <span class="post-count dislike-count">${Object.values(post.userReactions || {}).filter(r => r === 'dislike').length}</span>
        </div>

        ${isAdmin || isOwner ? `
          <div class="post-actions">
            ${isOwner ? '<button class="btn-edit">Edit</button>' : ''}
            <button class="btn-delete">Delete Post</button>
          </div>
        ` : ''}

        <div class="comments" data-post-id="${post.id}"></div>

        <div class="comment-form">
          <input type="text" class="comment-input" placeholder="Thy words...">
          <button class="btn-comment">Speak</button>
        </div>
      `;

      feed.prepend(postEl);

      // Render comments + admin delete only
      const commentsDiv = postEl.querySelector(".comments");
      const comments = JSON.parse(localStorage.getItem(`comments_${post.id}`)) || [];

      comments.forEach(c => {
        const cEl = document.createElement("div");
        cEl.className = "comment";
        cEl.innerHTML = `
          <span class="comment-user">${c.user}</span> ${c.text}
          ${isAdmin ? `<div class="comment-actions"><button class="btn-delete-comment">Delete</button></div>` : ''}
        `;
        commentsDiv.appendChild(cEl);

        if (isAdmin) {
          cEl.querySelector(".btn-delete-comment").onclick = () => {
            if (confirm("Delete this comment?")) {
              const updatedComments = comments.filter(cm => cm !== c);
              localStorage.setItem(`comments_${post.id}`, JSON.stringify(updatedComments));
              renderFeed();
            }
          };
        }
      });

      // Add new comment
      postEl.querySelector(".btn-comment").onclick = () => {
        const input = postEl.querySelector(".comment-input");
        const text = input.value.trim();
        if (!text) return;

        const newComment = { user: currentUser.username, text, date: Date.now() };
        comments.push(newComment);
        localStorage.setItem(`comments_${post.id}`, JSON.stringify(comments));

        renderFeed();
        input.value = "";
      };

      // Per-post reactions (single choice per user)
      const likeBtn = postEl.querySelector(".like");
      const dislikeBtn = postEl.querySelector(".dislike");

      if (!post.userReactions) post.userReactions = {};

      function updatePostReactionUI() {
        const userReaction = post.userReactions[currentUser.username || currentUser.email];

        likeBtn.classList.toggle("active", userReaction === "like");
        likeBtn.classList.toggle("inactive", userReaction && userReaction !== "like");
        dislikeBtn.classList.toggle("active", userReaction === "dislike");
        dislikeBtn.classList.toggle("inactive", userReaction && userReaction !== "dislike");

        let likes = 0;
        let dislikes = 0;
        Object.values(post.userReactions).forEach(r => {
          if (r === "like") likes++;
          if (r === "dislike") dislikes++;
        });

        postEl.querySelector(".like-count").textContent = likes;
        postEl.querySelector(".dislike-count").textContent = dislikes;
      }

      updatePostReactionUI();

      likeBtn.onclick = () => {
        const userId = currentUser.username || currentUser.email;
        if (post.userReactions[userId] === "like") {
          delete post.userReactions[userId];
        } else {
          post.userReactions[userId] = "like";
        }
        localStorage.setItem("posts", JSON.stringify(posts));
        updatePostReactionUI();
      };

      dislikeBtn.onclick = () => {
        const userId = currentUser.username || currentUser.email;
        if (post.userReactions[userId] === "dislike") {
          delete post.userReactions[userId];
        } else {
          post.userReactions[userId] = "dislike";
        }
        localStorage.setItem("posts", JSON.stringify(posts));
        updatePostReactionUI();
      };

      // Delete post (only admin or owner)
      const deleteBtn = postEl.querySelector(".btn-delete");
      if (deleteBtn) {
        deleteBtn.onclick = () => {
          if (confirm("Permanently burn this post?")) {
            posts = posts.filter(p => p.id !== post.id);
            localStorage.removeItem(`comments_${post.id}`);
            localStorage.setItem("posts", JSON.stringify(posts));
            renderFeed();
          }
        };
      }

      // Edit (text only) - only owner
      const editBtn = postEl.querySelector(".btn-edit");
      if (editBtn) {
        editBtn.onclick = () => {
          const contentDisplay = postEl.querySelector(".post-content");
          const editArea = document.createElement("textarea");
          editArea.className = "edit-textarea";
          editArea.value = post.text;

          const controls = document.createElement("div");
          controls.className = "edit-controls";

          const saveBtn = document.createElement("button");
          saveBtn.className = "btn-save-edit";
          saveBtn.textContent = "Save";
          saveBtn.onclick = () => {
            const newText = editArea.value.trim();
            if (newText) {
              post.text = newText;
              post.date = Date.now();
              localStorage.setItem("posts", JSON.stringify(posts));
              renderFeed();
            }
          };

          const cancelBtn = document.createElement("button");
          cancelBtn.className = "btn-cancel-edit";
          cancelBtn.textContent = "Cancel";
          cancelBtn.onclick = () => renderFeed();

          controls.appendChild(saveBtn);
          controls.appendChild(cancelBtn);

          contentDisplay.replaceWith(editArea);
          postEl.querySelector(".post-actions").replaceWith(controls);
        };
      }
    });
  }

  renderFeed();

  // New post with images
  document.getElementById("postBtn").onclick = () => {
    const textarea = document.getElementById("postContent");
    const text = textarea.value.trim();

    if (!text && selectedFiles.length === 0) return;

    const postImages = [];

    const promises = selectedFiles.map(file => {
      return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => {
          postImages.push(e.target.result);
          resolve();
        };
        reader.readAsDataURL(file);
      });
    });

    Promise.all(promises).then(() => {
      const newPost = {
        id: Date.now(),
        user: currentUser.username,
        text: text || "[Image only post]",
        date: Date.now(),
        images: postImages.length > 0 ? postImages : undefined,
        likes: 0,
        dislikes: 0,
        userReactions: {}
      };

      posts.unshift(newPost);
      localStorage.setItem("posts", JSON.stringify(posts));

      textarea.value = "";
      selectedFiles = [];
      previewContainer.innerHTML = "";

      renderFeed();
    });
  };

  // Smooth scroll to video
  window.addEventListener("load", () => {
    document.getElementById("videoSection").scrollIntoView({ behavior: "smooth", block: "start" });
  });
});
</script>
</body>
</html>
