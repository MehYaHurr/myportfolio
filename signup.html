<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kindle the Flame – Awaken</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000 url('https://images.unsplash.com/photo-1518709268805-4e9042af592d?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=90') center/cover fixed no-repeat;
      --card: rgba(12, 8, 18, 0.92);
      --accent: #d32f2f;
      --accent-dark: #b71c1c;
      --success: #4caf50;
      --danger: #f44336;
      --text: #f0e6d2;
      --text-muted: #a89a7c;
      --border: #2f1626;
      --glow: rgba(211, 47, 47, 0.35);
      --ember: #ff4d00;
      --ember-glow: rgba(255, 77, 0, 0.5);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Cinzel', serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background-attachment: fixed;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }

    .embers {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: radial-gradient(circle at 30% 30%, #fff8 15%, var(--ember) 50%, transparent 80%);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--ember-glow);
      opacity: 0;
      pointer-events: none;
      will-change: transform, opacity;
      transform: translate3d(0, 0, 0);
      animation: float linear forwards;
    }

    @keyframes float {
      0% { transform: translate3d(0, 100vh, 0) scale(0.3) rotate(0deg); opacity: 0; }
      10% { opacity: 0.8; }
      50% { opacity: 0.95; }
      90% { opacity: 0.5; }
      100% { transform: translate3d(var(--sway-x), -15vh, 0) scale(0.6) rotate(720deg); opacity: 0; }
    }

    .container {
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 2;
      min-height: 60vh;
      margin: 3rem 0;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      box-shadow: 
        0 25px 80px rgba(0,0,0,0.98),
        inset 0 0 60px rgba(0,0,0,0.75),
        0 0 100px var(--glow);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 40px 100px rgba(0,0,0,1), inset 0 0 70px rgba(0,0,0,0.8);
    }

    h1 {
      font-family: 'Cinzel Decorative', cursive;
      text-align: center;
      color: var(--accent);
      font-size: 3.6rem;
      letter-spacing: 4px;
      text-shadow: 0 0 40px var(--accent), 5px 5px 0 #000;
      margin-bottom: 0.6rem;
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 1.3rem;
      margin-bottom: 2.8rem;
      text-shadow: 2px 2px 8px #000;
    }

    .form-group {
      margin-bottom: 2rem;
    }

    label {
      display: block;
      margin-bottom: 0.6rem;
      color: var(--text-muted);
      font-size: 1.1rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 1.2rem 1.5rem;
      background: rgba(8, 5, 15, 0.8);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1.1rem;
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(211,47,47,0.3), inset 0 0 15px rgba(211,47,47,0.2);
    }

    .error-message {
      color: var(--danger);
      font-size: 0.95rem;
      margin-top: 0.5rem;
      min-height: 1.3em;
      display: block;
    }

    .password-rules {
      margin-top: 1.1rem;
      font-size: 0.96rem;
      color: var(--text-muted);
    }

    .rule {
      margin: 0.4rem 0;
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .rule.met::before {
      content: "✓";
      color: var(--success);
      font-weight: bold;
    }

    .rule.not-met::before {
      content: "•";
      color: var(--danger);
    }

    .btn {
      width: 100%;
      padding: 1.4rem;
      background: linear-gradient(145deg, var(--accent), var(--accent-dark));
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.25rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.35s ease;
      box-shadow: 0 10px 0 #000, inset 0 -4px rgba(0,0,0,0.6);
      margin-top: 2rem;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-4px);
      box-shadow: 0 16px 0 #000;
    }

    .btn:disabled {
      background: #3a2525;
      color: #776;
      cursor: not-allowed;
      transform: none;
      box-shadow: 0 6px 0 #000;
    }

    .signin-link {
      text-align: center;
      margin-top: 2.5rem;
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .signin-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .signin-link a:hover {
      text-decoration: underline;
      color: #ef5350;
    }

    @media (max-width: 500px) {
      body { padding: 1.5rem 1rem; }
      .card { padding: 2.5rem 1.8rem; }
      h1 { font-size: 3rem; }
      .container { margin: 2rem 0; }
    }
  </style>
</head>
<body>

<div class="embers" id="embers"></div>

<div class="container">
  <div class="card">
    <h1>Kindle the Flame</h1>
    <p class="subtitle">Ignite your eternal spark</p>

    <form id="signupForm" novalidate>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" required minlength="3" autocomplete="username" placeholder="Choose your flame name">
        <div class="error-message" id="usernameError"></div>
      </div>

      <div class="form-group">
        <label for="email">Email (Gmail only)</label>
        <input type="email" id="email" required autocomplete="email" placeholder="yourname@gmail.com">
        <div class="error-message" id="emailError"></div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="new-password" placeholder="••••••••">
        <div class="password-rules" id="passwordRules">
          <div class="rule not-met" data-rule="length">At least 8 characters</div>
          <div class="rule not-met" data-rule="upper">One uppercase letter</div>
          <div class="rule not-met" data-rule="lower">One lowercase letter</div>
          <div class="rule not-met" data-rule="digit">One number</div>
          <div class="rule not-met" data-rule="special">One special character (!@#$%^&* etc.)</div>
        </div>
        <div class="error-message" id="passwordError"></div>
      </div>

      <div class="form-group">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" required autocomplete="new-password" placeholder="••••••••">
        <div class="error-message" id="confirmError"></div>
      </div>

      <button type="submit" class="btn" id="submitBtn" disabled>Kindle My Flame</button>
    </form>

    <div class="signin-link">
      Already burning? <a href="signin.html">Sign In</a>
    </div>
  </div>
</div>

<script>
// Floating Embers
const embersContainer = document.getElementById('embers');
let activeParticles = 0;
const MAX_PARTICLES = 40;

function createEmber() {
  if (activeParticles >= MAX_PARTICLES) return;
  activeParticles++;

  const ember = document.createElement('div');
  ember.classList.add('particle');

  const size = Math.random() * 3 + 1;
  const left = Math.random() * 100;
  const duration = Math.random() * 8 + 8;
  const delay = Math.random() * 4;
  const swayX = (Math.random() - 0.5) * 80 + 'px';

  ember.style.width = `${size}px`;
  ember.style.height = `${size}px`;
  ember.style.left = `${left}%`;
  ember.style.bottom = '-10%';
  ember.style.animationDuration = `${duration}s`;
  ember.style.animationDelay = `${delay}s`;
  ember.style.setProperty('--sway-x', swayX);

  embersContainer.appendChild(ember);

  setTimeout(() => {
    if (ember.parentNode) ember.remove();
    activeParticles = Math.max(0, activeParticles - 1);
  }, (duration + delay + 1) * 1000);
}

setInterval(createEmber, 800 + Math.random() * 400);

// Form logic
const form = document.getElementById('signupForm');
const usernameInput = document.getElementById('username');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const confirmInput = document.getElementById('confirm');
const submitBtn = document.getElementById('submitBtn');

const usernameError = document.getElementById('usernameError');
const emailError    = document.getElementById('emailError');
const passwordError = document.getElementById('passwordError');
const confirmError  = document.getElementById('confirmError');

const rulesDivs = document.querySelectorAll('#passwordRules .rule');

function checkPasswordStrength() {
  const val = passwordInput.value;
  let validCount = 0;

  const checks = {
    length: val.length >= 8,
    upper: /[A-Z]/.test(val),
    lower: /[a-z]/.test(val),
    digit: /[0-9]/.test(val),
    special: /[!@#$%^&*(),.?":{}|<>]/.test(val)
  };

  rulesDivs.forEach(rule => {
    const key = rule.dataset.rule;
    if (checks[key]) {
      rule.classList.remove('not-met');
      rule.classList.add('met');
      validCount++;
    } else {
      rule.classList.remove('met');
      rule.classList.add('not-met');
    }
  });

  return validCount === 5;
}

function validateAll() {
  let isValid = true;

  if (usernameInput.value.trim().length < 3) {
    usernameError.textContent = "Username must be at least 3 characters";
    isValid = false;
  } else {
    usernameError.textContent = "";
  }

  const emailVal = emailInput.value.trim().toLowerCase();
  if (!emailVal) {
    emailError.textContent = "Email is required";
    isValid = false;
  } else if (!emailVal.endsWith('@gmail.com')) {
    emailError.textContent = "Please use a valid Gmail address";
    isValid = false;
  } else {
    emailError.textContent = "";
  }

  const pwStrong = checkPasswordStrength();
  if (!pwStrong) {
    passwordError.textContent = "Password does not meet all requirements";
    isValid = false;
  } else {
    passwordError.textContent = "";
  }

  if (confirmInput.value !== passwordInput.value && confirmInput.value.length > 0) {
    confirmError.textContent = "Passwords do not match";
    isValid = false;
  } else if (confirmInput.value.length === 0 && passwordInput.value.length > 0) {
    confirmError.textContent = "Please confirm your password";
    isValid = false;
  } else {
    confirmError.textContent = "";
  }

  submitBtn.disabled = !isValid;
}

[usernameInput, emailInput, passwordInput, confirmInput].forEach(el => {
  el.addEventListener('input', validateAll);
});

form.addEventListener('submit', e => {
  e.preventDefault();
  if (submitBtn.disabled) return;

  const email = emailInput.value.trim().toLowerCase();
  const username = usernameInput.value.trim();
  const password = passwordInput.value;

  const user = {
    username,
    email,
    password,                // saved normally
    role: email === "jaimericardos24@gmail.com" ? "admin" : "user"   // ← ADMIN CHECK HERE
  };

  localStorage.setItem(`flame_${email}`, JSON.stringify(user));

  submitBtn.textContent = "Flame Kindled... Redirecting...";
  submitBtn.disabled = true;

  setTimeout(() => {
    window.location.href = 'signin.html';
  }, 1400);
});

validateAll();
</script>
</body>
</html>
