<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kindle the Flame • The First Flame</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --card: rgba(6, 6, 8, 0.96);
      --accent: #4a0e0e;
      --accent-hover: #6b1818;
      --text: #a89e94;
      --text-dim: #5c554a;
      --border: #2a1a1a;
      --shadow: #000000;
      --particle: rgba(140, 130, 120, 0.07);
      --particle-glow: rgba(160, 150, 140, 0.04);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Cinzel', serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      overflow: hidden;
      position: relative;
    }

    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: var(--particle);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--particle-glow);
      opacity: 0;
      animation: drift linear infinite;
    }

    @keyframes drift {
      0%   { transform: translateY(100vh) translateX(0) scale(0.4); opacity: 0; }
      5%   { opacity: 0.6; }
      60%  { opacity: 0.35; }
      100% { transform: translateY(-40vh) translateX(80vw) scale(0.9); opacity: 0; }
    }

    .container {
      text-align: center;
      z-index: 2;
      max-width: 720px;
      padding: 3.5rem 2rem;
      background: var(--card);
      border-radius: 8px;
      border: 1px solid var(--border);
      box-shadow: 0 0 80px #000, inset 0 0 60px rgba(0,0,0,0.75);
    }

    h1 {
      font-family: 'Cinzel Decorative', cursive;
      font-size: clamp(4.5rem, 12vw, 7.5rem);
      color: #3c1a1a;
      text-shadow: 0 0 30px rgba(70,20,20,0.5), 0 0 60px rgba(50,10,10,0.3);
      margin-bottom: 1.2rem;
      letter-spacing: 12px;
      animation: faint-pulse 14s infinite alternate;
    }

    @keyframes faint-pulse {
      from { text-shadow: 0 0 30px rgba(70,20,20,0.5), 0 0 60px rgba(50,10,10,0.3); }
      to   { text-shadow: 0 0 55px rgba(90,30,30,0.4), 0 0 100px rgba(60,15,15,0.25); }
    }

    .subtitle {
      font-size: 1.5rem;
      color: var(--text-dim);
      margin: 1.8rem 0 3.5rem;
      letter-spacing: 1.8px;
      text-shadow: 1px 1px 6px #000;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem 3rem;
      margin: 2rem 0;
    }

    .auth-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 3rem 4rem;
      margin-top: 3.5rem;
      padding-top: 2.5rem;
      border-top: 1px dashed #2a1a1a;
    }

    .btn {
      position: relative;
      display: inline-block;
      padding: 1.2rem 2.8rem;
      min-width: 200px;
      font-size: 1.35rem;
      font-weight: 700;
      text-decoration: none;
      color: #a89e94;
      background: #0f0f0f;
      border: 2px solid #2a1a1a;
      box-shadow: 0 6px 0 #000, inset 0 -3px rgba(0,0,0,0.9);
      transition: all 0.25s ease;
      overflow: hidden;
    }

    .btn:hover {
      transform: translateY(-5px) rotate(1deg);
      box-shadow: 0 14px 0 #000, 0 0 25px rgba(60,20,20,0.3);
      color: #d4c0a8;
      border-color: #4a2a2a;
    }

    .btn:active {
      transform: translateY(-1px);
      box-shadow: 0 3px 0 #000;
    }

    /* Rectangular with slight unevenness */
    .btn-rect {
      border-radius: 6px 9px 7px 11px; /* asymmetric corners */
    }

    /* Torn / wavy bottom - Family */
    .btn-torn {
      border-radius: 8px 8px 24px 8px;
      clip-path: polygon(0 0, 100% 0, 100% 75%, 92% 88%, 80% 94%, 65% 98%, 45% 96%, 28% 92%, 12% 86%, 0 78%);
    }

    /* Personal - subtle torn look */
    .btn-personal {
      border-radius: 10px 6px 12px 8px;
      clip-path: polygon(4% 0, 100% 0, 100% 100%, 0 100%, 0 18%);
    }

    /* Sign In - slanted left cut */
    .btn-signin {
      clip-path: polygon(12% 0, 100% 0, 100% 100%, 0 100%);
      transform: skewX(-8deg);
      padding-left: 3.2rem;
      padding-right: 2.4rem;
    }

    /* Sign Up - strong diagonal wedge right */
    .btn-signup {
      clip-path: polygon(0 0, 88% 0, 100% 100%, 0 100%);
      background: #2a0f0f;
      color: #b87a7a;
      border-color: #4a1a1a;
      transform: skewX(12deg);
      padding-right: 3.8rem;
      padding-left: 2rem;
    }

    .btn-signup:hover {
      background: #3c1818;
      color: #d48c8c;
      border-color: #6b2424;
      box-shadow: 0 14px 0 #000, 0 0 30px rgba(100,20,20,0.4);
    }

    .btn-red {
      background: #2a0f0f;
      color: #a86969;
      border-color: #4a1a1a;
    }

    .btn-red:hover {
      background: #3c1818;
      color: #d48c8c;
    }
  </style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="container">
  <h1>THE FIRST FLAME</h1>
  <p class="subtitle">Fading echoes in an endless dark...</p>

  <div class="buttons">
    <a href="collection" class="btn btn-rect">Collection</a>
    <a href="education" class="btn btn-rect">Education</a>
    <a href="family"    class="btn btn-torn">Family</a>
    <a href="personal"  class="btn btn-personal">Personal</a>
  </div>

  <div class="auth-buttons">
    <a href="signin.html"  class="btn btn-signin btn-red">Sign In</a>
    <a href="signup.html"  class="btn btn-signup btn-red">Sign Up</a>
  </div>
</div>

<script>
// Particles (unchanged)
function createParticle() {
  const p = document.createElement('div');
  p.className = 'particle';
  const size = Math.random() * 3 + 1;
  p.style.width = p.style.height = size + 'px';
  p.style.left = Math.random() * 100 + 'vw';
  p.style.bottom = '-10px';
  p.style.animationDuration = (Math.random() * 40 + 35) + 's';
  p.style.animationDelay = Math.random() * 10 + 's';
  document.getElementById('particles').appendChild(p);
  setTimeout(() => p.remove(), 60000);
}
setInterval(createParticle, 800);

if (localStorage.getItem("currentUser")) {
  window.location.href = "feed.html";
}
</script>
</body>
</html>
