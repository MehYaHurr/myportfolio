<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kindle the Flame • The First Flame</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0000 url('https://images.unsplash.com/photo-1519681393784-d120267933ba?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=90') center/cover fixed no-repeat;
      --card: rgba(8, 4, 12, 0.94);
      --accent: #b91c1c;
      --accent-dark: #7f1d1d;
      --accent-glow: #dc2626;
      --text: #e5d5b8;
      --text-dim: #9c8a6a;
      --border: #3f1a1a;
      --ember: #ff3d00;
      --ember-glow: rgba(255, 61, 0, 0.65);
      --shadow: #000;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Cinzel', serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      background-attachment: fixed;
      overflow: hidden;
      position: relative;
    }
    .embers {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
    .ember {
      position: absolute;
      width: 5px;
      height: 5px;
      background: var(--ember);
      border-radius: 50%;
      box-shadow: 0 0 14px var(--ember-glow), 0 0 24px var(--ember-glow), 0 0 40px var(--ember-glow);
      opacity: 0;
      animation: rise linear infinite;
    }
    @keyframes rise {
      0%   { transform: translateY(100vh) scale(0.3) rotate(0deg); opacity: 0; }
      8%   { opacity: 0.9; }
      85%  { opacity: 0.75; }
      100% { transform: translateY(-30vh) scale(0.9) rotate(360deg); opacity: 0; }
    }
    .container {
      text-align: center;
      z-index: 2;
      max-width: 620px;
      padding: 2rem 1rem;
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 0 60px rgba(0,0,0,0.9), inset 0 0 40px rgba(139, 0, 0, 0.08);
    }
    h1 {
      font-family: 'Cinzel Decorative', cursive;
      font-size: clamp(4.2rem, 11vw, 6.8rem);
      color: var(--accent-glow);
      text-shadow: 
        0 0 20px var(--accent),
        0 0 40px var(--accent),
        6px 6px 0 var(--shadow);
      margin-bottom: 0.8rem;
      letter-spacing: 8px;
      animation: pulse-glow 5s infinite alternate;
    }
    @keyframes pulse-glow {
      from { text-shadow: 0 0 20px var(--accent), 0 0 40px var(--accent), 6px 6px 0 var(--shadow); }
      to   { text-shadow: 0 0 50px var(--accent-glow), 0 0 80px var(--accent), 8px 8px 0 var(--shadow); }
    }
    .subtitle {
      font-size: 1.6rem;
      color: var(--text-dim);
      margin: 1.5rem 0 2.5rem;
      text-shadow: 2px 2px 10px #000;
      letter-spacing: 1px;
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.2rem 1.8rem;
      margin-top: 1.5rem;
    }
    .btn {
      display: inline-block;
      padding: 1.1rem 2.4rem;
      min-width: 220px;
      background: linear-gradient(145deg, var(--accent), var(--accent-dark));
      color: white;
      font-size: 1.35rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: 10px;
      border: 2px solid var(--border);
      box-shadow: 0 8px 0 var(--shadow), inset 0 -3px rgba(0,0,0,0.6);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }
    .btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 14px 0 var(--shadow);
      background: linear-gradient(145deg, #dc2626, #991b1b);
    }
    .btn:active {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 var(--shadow);
    }
    .btn::before {
      content: "";
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transition: 0.6s;
    }
    .btn:hover::before {
      left: 100%;
    }
  </style>
</head>
<body>
<div class="embers" id="embers"></div>

<div class="container">
  <h1>THE FIRST FLAME</h1>
  <p class="subtitle">Only the worthy may kindle the bonfire...</p>

  <div class="buttons">
    <a href="collection" class="btn">Collection</a>
    <a href="Education" class="btn">Education</a>
    <a href="family" class="btn">Family</a>
    <a href="persona1" class="btn">Persona I</a>
  </div>
</div>

<script>
// Floating embers effect
function createEmber() {
  const ember = document.createElement('div');
  ember.className = 'ember';
  const size = Math.random() * 6 + 3;
  ember.style.width = ember.style.height = size + 'px';
  ember.style.left = Math.random() * 100 + 'vw';
  ember.style.bottom = '-20px';
  ember.style.animationDuration = (Math.random() * 18 + 14) + 's';
  ember.style.animationDelay = Math.random() * 6 + 's';
  document.getElementById('embers').appendChild(ember);
  setTimeout(() => ember.remove(), 40000);
}
setInterval(createEmber, 600);

// Auto-redirect if already logged in
if (localStorage.getItem("currentUser")) {
  window.location.href = "feed.html";
}
</script>
</body>
</html>
