<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kindle the Flame • The First Flame</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --card: rgba(6, 6, 8, 0.96);
      --text: #a89e94;
      --text-dim: #5c554a;
      --border: #1a0f0f;
      --particle: rgba(140, 130, 120, 0.07);
      --particle-glow: rgba(160, 150, 140, 0.04);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Cinzel', serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
      overflow-y: scroll;
      position: relative;
    }

    .particles { position: fixed; inset: 0; pointer-events: none; z-index: 1; }

    .particle {
      position: absolute;
      width: 2px; height: 2px;
      background: var(--particle);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--particle-glow);
      opacity: 0;
      animation: drift linear infinite;
    }

    @keyframes drift {
      0%   { transform: translateY(100vh) translateX(0) scale(0.4); opacity: 0; }
      5%   { opacity: 0.6; }
      60%  { opacity: 0.35; }
      100% { transform: translateY(-40vh) translateX(80vw) scale(0.9); opacity: 0; }
    }

    .container {
      text-align: center;
      z-index: 2;
      width: 100%;
      max-width: 620px;
      padding: 2.5rem 1.8rem;
      background: var(--card);
      border-radius: 6px;
      border: 1px solid var(--border);
      box-shadow: 0 0 80px #000, inset 0 0 60px rgba(0,0,0,0.7);
      margin: auto;
    }

    h1 {
      font-family: 'Cinzel Decorative', cursive;
      font-size: clamp(2rem, 8vw, 3.8rem);
      color: #3c1a1a;
      text-shadow: 0 0 30px rgba(70,20,20,0.5), 0 0 60px rgba(50,10,10,0.3);
      margin-bottom: 1rem;
      letter-spacing: 6px;
      line-height: 1.2;
      animation: faint-pulse 12s infinite alternate;
    }

    @keyframes faint-pulse {
      from { text-shadow: 0 0 30px rgba(70,20,20,0.5), 0 0 60px rgba(50,10,10,0.3); }
      to   { text-shadow: 0 0 50px rgba(90,30,30,0.4), 0 0 90px rgba(60,15,15,0.25); }
    }

    .subtitle {
      font-size: 1rem;
      color: var(--text-dim);
      margin: 1.2rem 0 2rem;
      letter-spacing: 1.5px;
      text-shadow: 1px 1px 6px #000;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem 1.5rem;
      margin: 1rem 0 2rem;
    }

    .auth-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.2rem 2rem;
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid #1a0f0f;
    }

    .btn {
      display: inline-block;
      padding: 0.9rem 2rem;
      min-width: 180px;
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: 4px;
      border: 1px solid #1a0f0f;
      box-shadow: 0 6px 0 #000, inset 0 -2px rgba(0,0,0,0.8);
      transition: all 0.3s ease;
      background: #0f0f0f;
      color: #8c8278;
    }

    .btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 0 #000;
      background: #161616;
      color: #b8a894;
      border-color: #3c1a1a;
    }

    .btn-auth {
      background: #0a0000;
      color: #e03030;
      border: 2px solid #cc2020;
      box-shadow: 0 6px 0 #000, 0 0 12px rgba(200,30,30,0.2);
      letter-spacing: 2px;
    }

    .btn-auth:hover {
      background: #180000;
      color: #ff5555;
      border-color: #ff2222;
      box-shadow: 0 12px 0 #000, 0 0 28px rgba(200,40,40,0.5);
      transform: translateY(-4px);
    }

    .btn:active { transform: translateY(-1px); box-shadow: 0 3px 0 #000; }
  </style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="container">
  <h1>THE FIRST FLAME</h1>
  <p class="subtitle">Fading echoes in an endless dark...</p>

  <div class="buttons">
    <a href="collection" class="btn">Collection</a>
    <a href="Education" class="btn">Education</a>
    <a href="family" class="btn">Family</a>
    <a href="persona1" class="btn">Persona I</a>
  </div>

  <div class="auth-buttons">
    <a href="signin.html" class="btn btn-auth">Sign In</a>
    <a href="signup.html" class="btn btn-auth">Sign Up</a>
  </div>
</div>

<script>
function createParticle() {
  const p = document.createElement('div');
  p.className = 'particle';
  const size = Math.random() * 3 + 1;
  p.style.width = p.style.height = size + 'px';
  p.style.left = Math.random() * 100 + 'vw';
  p.style.bottom = '-10px';
  p.style.animationDuration = (Math.random() * 40 + 35) + 's';
  p.style.animationDelay = Math.random() * 10 + 's';
  document.getElementById('particles').appendChild(p);
  setTimeout(() => p.remove(), 60000);
}
setInterval(createParticle, 800);

if (localStorage.getItem("currentUser")) {
  window.location.href = "feed.html";
}
</script>
</body>
</html>
